name: stream_chat_v1
description: "Stream Chat V1 - Flutter Real-Time Messaging App (UI Prototype)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.0.7
  cupertino_icons: ^1.0.8
  go_router: ^14.6.3
  provider: ^6.1.2
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  timeago: ^3.7.0
  stream_chat_flutter_core: ^9.24.0
  dart_jsonwebtoken: ^3.4.1
  shared_preferences: ^2.5.5
  crypto: ^3.0.7
  uuid: ^4.5.3
  stream_chat_localizations: ^9.24.0
  file_picker: ^10.3.10
  url_launcher: ^6.3.2
  open_filex: ^4.5.0
  dio: ^5.7.0
  path_provider: ^2.1.5
  firebase_core: ^3.13.1
  firebase_messaging: ^15.2.5
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#005FFF"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
